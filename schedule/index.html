<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="Schedule for IoF Graduate Conference 2026">
<meta name="theme-color" content="#2e2e33">
<meta property="og:title" content="Schedule | IoF Graduate Conference">
<meta property="og:description" content="Schedule for IoF Graduate Conference 2026">
<meta property="og:site_name" content="IoF Graduate Conference">
<meta property="og:type" content="article">
<meta property="og:url" content="https://iofhc.github.io/schedule/">
<title>Schedule | IoF Graduate Conference</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #2e2e33;
    --bg-card:   #38383e;
    --bg-nav:    #25252a;
    --accent:    #81a1c1;
    --accent2:   #88c0d0;
    --text:      #d8dee9;
    --text-dim:  #9099a6;
    --text-head: #eceff4;
    --border:    #44444c;
    --code-bg:   #44444c;
    --green:     #a3be8c;
    --link:      #88c0d0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── SITE NAV (top, sticky) ── */
  nav.site-nav {
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    min-height: 52px;
  }

  .nav-brand {
    font-weight: 700;
    font-size: 15px;
    color: var(--text-head);
    white-space: nowrap;
    padding: 10px 0;
  }
  .nav-brand:hover { text-decoration: none; color: var(--accent2); }

  .nav-links {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
  }
  .nav-links li a {
    display: block;
    padding: 14px 14px;
    font-size: 14px;
    color: var(--text-dim);
    transition: color 0.15s;
  }
  .nav-links li a:hover { color: var(--text-head); text-decoration: none; }
  .nav-links li a.active {
    color: var(--text-head);
    border-bottom: 2px solid var(--accent2);
  }

  /* ── DAY SUB-NAV (sticky, below site-nav) ── */
  nav.day-nav {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 52px;
    z-index: 190;
  }

  .day-nav-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    min-height: 40px;
  }

  .day-nav-inner a {
    display: block;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s;
  }
  .day-nav-inner a:hover  { color: var(--text-head); text-decoration: none; }
  .day-nav-inner a.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* ── INLINE SESSION TAB BAR (inside main content, not sticky) ── */
  .session-tabs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    background: var(--bg-nav);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    margin: 16px 0 20px;
  }

  .session-tabs .tab-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 8px;
    white-space: nowrap;
  }

  .session-tabs a {
    display: inline-block;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
  }
  .session-tabs a:hover {
    color: var(--text-head);
    background: var(--border);
    text-decoration: none;
  }

  .session-tabs .tab-divider {
    color: var(--border);
    font-size: 18px;
    padding: 0 4px;
    user-select: none;
  }

  /* ── BREADCRUMB ── */
  .breadcrumb {
    max-width: 900px;
    margin: 24px auto 0;
    padding: 0 20px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .breadcrumb a { color: var(--link); }

  /* ── MAIN ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 60px;
    flex: 1;
    width: 100%;
  }

  h1.page-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-head);
    margin-bottom: 6px;
    line-height: 1.25;
  }

  .page-subtitle {
    font-size: 15px;
    color: var(--text-dim);
    margin-bottom: 36px;
  }

  h2.day-heading {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-head);
    margin: 40px 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  h3.time-slot {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    margin: 28px 0 4px;
    letter-spacing: 0.02em;
  }

  h3.event-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-head);
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .label {
    display: inline-block;
    background: var(--code-bg);
    color: var(--text-head);
    font-family: 'Source Code Pro', 'Courier New', monospace;
    font-size: 12.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 4px;
  }

  .detail-line {
    margin: 4px 0;
    font-size: 15px;
    color: var(--text);
  }

  hr.day-rule {
    border: none;
    border-top: 1px solid var(--border);
    margin: 48px 0 0;
  }

  .parallel-label {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 8px;
  }

  .session-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .session-card-head {
    background: var(--bg-nav);
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
  }

  .session-id {
    font-family: 'Source Code Pro', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .session-theme {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-head);
    line-height: 1.35;
    margin-bottom: 3px;
  }

  .session-venue { font-size: 12px; color: var(--text-dim); }

  .session-chair {
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }

  .pres-list {
    list-style: none;
    padding: 10px 14px 12px;
  }

  .pres-list li {
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .pres-list li:last-child { border-bottom: none; }

  .pres-num {
    font-family: 'Source Code Pro', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }

  .pres-title {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 3px;
  }

  .pres-author {
    font-size: 11.5px;
    color: var(--text-dim);
    font-style: italic;
  }

  .tag {
    display: inline-block;
    background: var(--code-bg);
    color: var(--green);
    font-family: 'Source Code Pro', monospace;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    margin: 2px 2px 2px 0;
  }

  /* ── FOOTER ── */
  footer {
    background: var(--bg-nav);
    border-top: 1px solid var(--border);
    padding: 20px;
    text-align: center;
</nav>

<!-- ── BREADCRUMB ── -->
<div class="breadcrumb"><a href="https://iofhc.github.io/">Home</a></div>

<main>
  <h1 class="page-title">Schedule</h1>

  <h3 class="time-slot" style="margin-top:28px">11:00 AM – 11:30 AM</h3>
  <h3 class="event-name">Tea Break</h3>

  <h3 class="time-slot">11:30 AM – 01:00 PM</h3>
  <h3 class="event-name">Parallel Session B:</h3>
  <p class="parallel-label">
    <span class="label">B1:</span> Forest and Nature-Based Solution — Auditorium Hall&nbsp;&nbsp;
    <span class="label">B2:</span> Forest and Nature-Based Solution — Seminar Hall I&nbsp;&nbsp;
    <span class="label">B3:</span> Wildlife and Biodiversity Conservation — Seminar Hall II
  var linkDay1 = document.getElementById('link-day1');
  var linkDay2 = document.getElementById('link-day2');
  var day2el   = document.getElementById('day2');

  function siteNavH() {
    return document.querySelector('nav.site-nav').offsetHeight +
           document.querySelector('nav.day-nav').offsetHeight;
  }

  function update() {
    var day2top = day2el.getBoundingClientRect().top;
    var inDay2  = day2top <= 10;
    linkDay1.classList.toggle('active', !inDay2);
    linkDay2.classList.toggle('active',  inDay2);
  }

  window.addEventListener('scroll', update, { passive: true });
  update();

  // Smooth scroll with offset for both sticky bars
  document.querySelectorAll('nav.day-nav a, nav.session-tabs a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      var target = document.querySelector(this.getAttribute('href'));
      if (!target) return;
      e.preventDefault();
      var top = target.getBoundingClientRect().top + window.scrollY - siteNavH() - 8;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
